spring.application.name=catalog-service
server.port=8082

# --- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5434/catalog_db
spring.datasource.username=app
spring.datasource.password=app

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
app.security.permit-all[0]=/hotels
app.security.permit-all[1]=/api/rooms/**
app.security.permit-all[2]=/catering/**
app.security.permit-all[3]=/services/**
app.security.permit-all[4]=/health
app.security.permit-all[5]=/error
server.tomcat.uri-encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.flyway.encoding=UTF-8

